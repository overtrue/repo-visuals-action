name: Self-hosted Repository Visuals
description: Generate and publish star history charts and contributor walls using GitHub Actions and the GitHub API
author: overtrue

branding:
  icon: star
  color: orange

inputs:
  github-token:
    description: Repository-scoped token used to read stars and publish artifacts
    required: true
  stargazers-token:
    description: Optional admin or collaborator user token used only to bootstrap historical timestamps
    required: false
  output-branch:
    description: Branch that stores the generated history and SVG files
    required: false
    default: star-history
  output-path:
    description: Repository-relative directory inside the output branch
    required: false
    default: .
  chart-style:
    description: Color theme (classic, minimal, gradient, midnight, sunset, ocean, forest, flame, mono)
    required: false
    default: classic
  chart-variant:
    description: Chart shape override (area, line, or glow); defaults to the theme's own variant
    required: false
    default: ""
  chart-title:
    description: Custom heading for the star chart (defaults to "Star History")
    required: false
    default: ""
  smooth:
    description: Draw a smooth monotone curve instead of straight segments
    required: false
    default: "true"
  background-color:
    description: Override the light-mode surface color (hex, e.g. #ffffff)
    required: false
    default: ""
  background-color-dark:
    description: Override the dark-mode surface color (hex, e.g. #0d1117)
    required: false
    default: ""
  accent-color:
    description: Override the light-mode line/accent color (hex)
    required: false
    default: ""
  accent-color-dark:
    description: Override the dark-mode line/accent color (hex)
    required: false
    default: ""
  animate:
    description: Add a reduced-motion-aware SVG entrance animation
    required: false
    default: "true"
  contributors:
    description: Generate light and dark contributor wall SVG files
    required: false
    default: "false"
  contributors-limit:
    description: Maximum number of non-bot contributors to include (1-200)
    required: false
    default: "150"
  contributors-title:
    description: Custom heading for the contributor wall (defaults to "Contributors")
    required: false
    default: ""
  contributors-columns:
    description: Number of avatars per row in the contributor wall (4-32)
    required: false
    default: "16"
  avatar-size:
    description: Avatar edge length in pixels for the contributor wall (24-128)
    required: false
    default: "48"
  avatar-gap:
    description: Spacing in pixels between contributor avatars (0-48)
    required: false
    default: "8"
  avatar-shape:
    description: Avatar shape in the contributor wall (circle, squircle, or square)
    required: false
    default: circle
  padding:
    description: Outer padding in pixels around the contributor wall (8-96)
    required: false
    default: "32"
  bootstrap:
    description: Fetch historical timestamps with stargazers-token when no history exists
    required: false
    default: "false"
  commit-message:
    description: Commit message used when generated artifacts change
    required: false
    default: "chore: update star history"

outputs:
  stars:
    description: Current stargazer count
  changed:
    description: Whether a new artifact commit was published
  commit-sha:
    description: Commit containing the generated artifacts
  light-url:
    description: Raw URL for the light chart
  dark-url:
    description: Raw URL for the dark chart
  history-url:
    description: Raw URL for the aggregated history JSON
  contributors:
    description: Number of contributors included in the wall
  contributors-light-url:
    description: Raw URL for the light contributor wall
  contributors-dark-url:
    description: Raw URL for the dark contributor wall

runs:
  using: node24
  main: dist/index.cjs
