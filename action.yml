name: Self-hosted Repository Visuals
description: Generate and publish star history charts and contributor walls using GitHub Actions and the GitHub API
author: overtrue

branding:
  icon: star
  color: orange

inputs:
  github-token:
    description: Repository-scoped token used to read stars and publish artifacts
    required: true
  stargazers-token:
    description: Optional admin or collaborator user token used only to bootstrap historical timestamps
    required: false
  output-branch:
    description: Branch that stores the generated history and SVG files
    required: false
    default: star-history
  output-path:
    description: Repository-relative directory inside the output branch
    required: false
    default: .
  chart-style:
    description: SVG chart style (classic, minimal, or gradient)
    required: false
    default: classic
  animate:
    description: Add a reduced-motion-aware SVG entrance animation
    required: false
    default: "true"
  contributors:
    description: Generate light and dark contributor wall SVG files
    required: false
    default: "false"
  contributors-limit:
    description: Maximum number of non-bot contributors to include (1-200)
    required: false
    default: "150"
  bootstrap:
    description: Fetch historical timestamps with stargazers-token when no history exists
    required: false
    default: "false"
  commit-message:
    description: Commit message used when generated artifacts change
    required: false
    default: "chore: update star history"

outputs:
  stars:
    description: Current stargazer count
  changed:
    description: Whether a new artifact commit was published
  commit-sha:
    description: Commit containing the generated artifacts
  light-url:
    description: Raw URL for the light chart
  dark-url:
    description: Raw URL for the dark chart
  history-url:
    description: Raw URL for the aggregated history JSON
  contributors:
    description: Number of contributors included in the wall
  contributors-light-url:
    description: Raw URL for the light contributor wall
  contributors-dark-url:
    description: Raw URL for the dark contributor wall

runs:
  using: node24
  main: dist/index.cjs
