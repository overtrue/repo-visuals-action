<title id="title">overtrue/repo-visuals-action Star History</title>
<desc id="description">4 stars as of 2026-11-15. Daily cumulative star trend.</desc>
<defs>
<linearGradient id="trend" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#3ecf8e"/><stop offset="100%" stop-color="#38bdf8"/></linearGradient>
<linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#3ecf8e" stop-opacity="0.22"/><stop offset="55%" stop-color="#38bdf8" stop-opacity="0.06"/><stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/></linearGradient>
<radialGradient id="marker-halo" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#38bdf8" stop-opacity="0.55"/><stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
<radialGradient id="surface-glow" cx="82%" cy="8%" r="70%"><stop offset="0%" stop-color="#38bdf8" stop-opacity="0.08"/><stop offset="100%" stop-color="#0f172a" stop-opacity="0"/></radialGradient>
